<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>配送地址选择 · company</title>
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}button{appearance:none;background:transparent;border:0;font:inherit;margin:0;padding:0}.choice-header{align-items:center;display:flex;justify-content:space-between}.choice-option.is-selected::after{content:" ✓"}</style>
</head>
<body><main id="address.root" style="box-sizing:border-box;display:flex;flex-direction:column;height:932px;padding-bottom:37px;padding-top:59px;position:relative;width:430px;background-color:#FFF8EF;color:#241713"><div id="address.header" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:8px;height:64px;justify-content:space-between;padding:0px 22px 0px 22px;width:100%"><button type="button" id="address.back" data-stable-id="address.back" style="height:48px;width:64px;background-color:#FFFFFF;border-radius:16px;color:#E6472F;font-size:15px;font-weight:600;line-height:22px">返回</button><div id="address.brand" data-stable-id="address.brand" style="color:#E6472F;font-size:15px;font-weight:600;line-height:22px">Food AI</div></div><div id="address.content" style="position:relative;display:flex;flex:1;flex-direction:column;gap:16px;overflow:auto;padding:8px 22px 16px 22px;width:100%"><div id="address.title" data-stable-id="address.title" style="color:#241713;font-size:26px;font-weight:700;line-height:36px">配送地址选择</div><div id="address.description" data-stable-id="address.description" style="color:#77655F;font-size:15px;font-weight:400;line-height:23px">选择本次配送地点，确认后更新首页。</div><section id="address.option" style="gap:8px;width:100%"><div class="choice-header" style="margin-bottom:12px"><div style="color:#241713;font-size:18px;font-weight:600;line-height:26px">常用地址</div></div><div style="display:grid;gap:8px;grid-template-columns:repeat(1,minmax(0,1fr))"><button type="button" class="choice-option" id="address.option.home" data-stable-id="address.option.home" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px" aria-pressed="false">家 · 望京</button><button type="button" class="choice-option is-selected" id="address.option.company" data-stable-id="address.option.company" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px;background-color:#F7D7B5;border-color:#E6472F;color:#E6472F" aria-pressed="true">公司 · 中关村</button></div></section><div id="address.detail" style="position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 16px 16px 16px;width:100%;background-color:#FFFFFF;border-radius:16px"><div id="address.detail.tag" data-stable-id="address.detail.tag" style="color:#E6472F;font-size:13px;font-weight:400;line-height:20px">公司</div><div id="address.detail.address" data-stable-id="address.detail.address" style="color:#241713;font-size:18px;font-weight:600;line-height:26px">北京市海淀区中关村东路 8 号</div><div id="address.detail.room" data-stable-id="address.detail.room" style="color:#241713;font-size:15px;font-weight:400;line-height:23px">B 座 6 层前台</div><div id="address.detail.contact" data-stable-id="address.detail.contact" style="color:#77655F;font-size:13px;font-weight:400;line-height:20px">测试用户 · 138****0000</div></div><div id="address.notice" data-stable-id="address.notice" style="color:#77655F;font-size:13px;font-weight:400;line-height:20px">仅配送至已保存地址。</div></div><div id="address.footer" style="position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 22px 16px 22px;width:100%;background-color:#FFFFFF;border-top-color:#E8DCD3;border-top-style:solid;border-top-width:1px"><div id="address.summary" data-stable-id="address.summary" style="color:#241713;font-size:15px;font-weight:600;line-height:22px">已选择：公司 · 中关村</div><button type="button" id="address.confirm" data-stable-id="address.confirm" style="height:48px;width:100%;background-color:#E6472F;border-radius:16px;color:#FFFFFF;font-size:15px;font-weight:600;line-height:22px">确认配送地址</button></div></main></body>
</html>
