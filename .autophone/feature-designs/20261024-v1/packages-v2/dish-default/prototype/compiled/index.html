<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>菜品规格与数量 · default</title>
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}button{appearance:none;background:transparent;border:0;font:inherit;margin:0;padding:0}.choice-header{align-items:center;display:flex;justify-content:space-between}.choice-option.is-selected::after{content:" ✓"}</style>
</head>
<body><main id="dish.root" style="box-sizing:border-box;display:flex;flex-direction:column;height:932px;padding-bottom:37px;padding-top:59px;position:relative;width:430px;background-color:#FFF8EF;color:#241713"><div id="dish.header" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:8px;height:64px;justify-content:space-between;padding:0px 22px 0px 22px;width:100%"><button type="button" id="dish.back" data-stable-id="dish.back" style="height:48px;width:64px;background-color:#FFFFFF;border-radius:16px;color:#E6472F;font-size:15px;font-weight:600;line-height:22px">返回</button><div id="dish.brand" data-stable-id="dish.brand" style="color:#E6472F;font-size:15px;font-weight:600;line-height:22px">Food AI</div></div><div id="dish.content" style="position:relative;display:flex;flex:1;flex-direction:column;gap:16px;overflow:auto;padding:8px 22px 16px 22px;width:100%"><div id="dish.title" data-stable-id="dish.title" style="color:#241713;font-size:26px;font-weight:700;line-height:36px">菜品规格与数量</div><div id="dish.dish.card" style="position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 16px 16px 16px;width:100%;background-color:#FFFFFF;border-radius:16px"><div id="dish.name" data-stable-id="dish.name" style="color:#241713;font-size:18px;font-weight:600;line-height:26px">炙烤牛肉拌饭</div><div id="dish.description" data-stable-id="dish.description" style="color:#77655F;font-size:13px;font-weight:400;line-height:20px">热乎 · 微辣 · 25–35 分钟送达</div><div id="dish.base_price" data-stable-id="dish.base_price" style="color:#E6472F;font-size:28px;font-weight:700;line-height:38px">¥32 起</div></div><section id="dish.portion" style="gap:8px;width:100%"><div class="choice-header" style="margin-bottom:12px"><div style="color:#241713;font-size:18px;font-weight:600;line-height:26px">份量</div></div><div style="display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))"><button type="button" class="choice-option is-selected" id="dish.portion.standard" data-stable-id="dish.portion.standard" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px;background-color:#F7D7B5;border-color:#E6472F;color:#E6472F" aria-pressed="true">标准份</button><button type="button" class="choice-option" id="dish.portion.large" data-stable-id="dish.portion.large" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px" aria-pressed="false">大份 +¥6</button></div></section><section id="dish.extras" style="gap:8px;width:100%"><div class="choice-header" style="margin-bottom:12px"><div style="color:#241713;font-size:18px;font-weight:600;line-height:26px">加料（可多选）</div></div><div style="display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))"><button type="button" class="choice-option" id="dish.extras.egg" data-stable-id="dish.extras.egg" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px" aria-pressed="false">加蛋 +¥3</button><button type="button" class="choice-option" id="dish.extras.tofu" data-stable-id="dish.extras.tofu" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px" aria-pressed="false">豆腐 +¥4</button><button type="button" class="choice-option" id="dish.extras.vegetables" data-stable-id="dish.extras.vegetables" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px" aria-pressed="false">蔬菜 +¥5</button></div></section><div id="dish.quantity.row" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:8px;justify-content:space-between;width:100%"><div id="dish.quantity.label" data-stable-id="dish.quantity.label" style="color:#241713;font-size:18px;font-weight:600;line-height:26px">数量</div><div id="dish.quantity.controls" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:20px;width:fit-content"><button type="button" id="dish.quantity.decrease" data-stable-id="dish.quantity.decrease" style="height:48px;width:48px;background-color:#F3ECE6;border-radius:16px;color:#77655F;font-size:15px;font-weight:600;line-height:22px">−</button><div id="dish.quantity.value" data-stable-id="dish.quantity.value" style="color:#241713;font-size:18px;font-weight:600;line-height:26px">1</div><button type="button" id="dish.quantity.increase" data-stable-id="dish.quantity.increase" style="height:48px;width:48px;background-color:#FFFFFF;border-radius:16px;color:#E6472F;font-size:15px;font-weight:600;line-height:22px">+</button></div></div><div id="dish.selection" data-stable-id="dish.selection" style="color:#77655F;font-size:13px;font-weight:400;line-height:20px">标准份 · 不加料 · 1 份</div></div><div id="dish.footer" style="position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 22px 16px 22px;width:100%;background-color:#FFFFFF;border-top-color:#E8DCD3;border-top-style:solid;border-top-width:1px"><div id="dish.total.row" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:8px;justify-content:space-between;width:100%"><div id="dish.total.label" data-stable-id="dish.total.label" style="color:#241713;font-size:15px;font-weight:600;line-height:22px">商品合计</div><div id="dish.total" data-stable-id="dish.total" style="color:#E6472F;font-size:28px;font-weight:700;line-height:38px">¥32</div></div><button type="button" id="dish.add" data-stable-id="dish.add" style="height:48px;width:100%;background-color:#E6472F;border-radius:16px;color:#FFFFFF;font-size:15px;font-weight:600;line-height:22px">加入购物车</button></div></main></body>
</html>
