<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>饮食偏好设置 · edited</title>
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}button{appearance:none;background:transparent;border:0;font:inherit;margin:0;padding:0}.choice-header{align-items:center;display:flex;justify-content:space-between}.choice-option.is-selected::after{content:" ✓"}</style>
</head>
<body><main id="preferences.root" style="box-sizing:border-box;display:flex;flex-direction:column;height:932px;padding-bottom:37px;padding-top:59px;position:relative;width:430px;background-color:#FFF8EF;color:#241713"><div id="preferences.header" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:8px;height:64px;justify-content:space-between;padding:0px 22px 0px 22px;width:100%"><button type="button" id="preferences.back" data-stable-id="preferences.back" style="height:48px;width:64px;background-color:#FFFFFF;border-radius:16px;color:#E6472F;font-size:15px;font-weight:600;line-height:22px">返回</button><div id="preferences.brand" data-stable-id="preferences.brand" style="color:#E6472F;font-size:15px;font-weight:600;line-height:22px">Food AI</div></div><div id="preferences.content" style="position:relative;display:flex;flex:1;flex-direction:column;gap:16px;overflow:auto;padding:8px 22px 16px 22px;width:100%"><div id="preferences.title" data-stable-id="preferences.title" style="color:#241713;font-size:26px;font-weight:700;line-height:36px">饮食偏好设置</div><div id="preferences.description" data-stable-id="preferences.description" style="color:#77655F;font-size:15px;font-weight:400;line-height:23px">设置口味、忌口与单餐预算。</div><section id="preferences.spice" style="gap:8px;width:100%"><div class="choice-header" style="margin-bottom:12px"><div style="color:#241713;font-size:18px;font-weight:600;line-height:26px">辣度</div></div><div style="display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))"><button type="button" class="choice-option is-selected" id="preferences.spice.none" data-stable-id="preferences.spice.none" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px;background-color:#F7D7B5;border-color:#E6472F;color:#E6472F" aria-pressed="true">不辣</button><button type="button" class="choice-option" id="preferences.spice.mild" data-stable-id="preferences.spice.mild" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px" aria-pressed="false">微辣</button><button type="button" class="choice-option" id="preferences.spice.hot" data-stable-id="preferences.spice.hot" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px" aria-pressed="false">中辣</button></div></section><section id="preferences.avoid" style="gap:8px;width:100%"><div class="choice-header" style="margin-bottom:12px"><div style="color:#241713;font-size:18px;font-weight:600;line-height:26px">忌口（最多 2 项）</div></div><div style="display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))"><button type="button" class="choice-option is-selected" id="preferences.avoid.coriander" data-stable-id="preferences.avoid.coriander" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px;background-color:#F7D7B5;border-color:#E6472F;color:#E6472F" aria-pressed="true">香菜</button><button type="button" class="choice-option" id="preferences.avoid.onion" data-stable-id="preferences.avoid.onion" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px" aria-pressed="false">洋葱</button><button type="button" class="choice-option is-selected" id="preferences.avoid.peanut" data-stable-id="preferences.avoid.peanut" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px;background-color:#F7D7B5;border-color:#E6472F;color:#E6472F" aria-pressed="true">花生</button></div></section><section id="preferences.budget" style="gap:8px;width:100%"><div class="choice-header" style="margin-bottom:12px"><div style="color:#241713;font-size:18px;font-weight:600;line-height:26px">单餐预算</div></div><div style="display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))"><button type="button" class="choice-option is-selected" id="preferences.budget.under30" data-stable-id="preferences.budget.under30" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px;background-color:#F7D7B5;border-color:#E6472F;color:#E6472F" aria-pressed="true">¥30 内</button><button type="button" class="choice-option" id="preferences.budget.under40" data-stable-id="preferences.budget.under40" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px" aria-pressed="false">¥40 内</button><button type="button" class="choice-option" id="preferences.budget.any" data-stable-id="preferences.budget.any" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px" aria-pressed="false">不限</button></div></section><div id="preferences.summary.card" style="position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 16px 16px 16px;width:100%;background-color:#FFFFFF;border-radius:16px"><div id="preferences.summary.title" data-stable-id="preferences.summary.title" style="color:#77655F;font-size:13px;font-weight:400;line-height:20px">当前偏好</div><div id="preferences.summary" data-stable-id="preferences.summary" style="color:#241713;font-size:15px;font-weight:600;line-height:22px">不辣 · 不要香菜、花生 · ¥30 内</div><div id="preferences.disclaimer" data-stable-id="preferences.disclaimer" style="color:#77655F;font-size:13px;font-weight:400;line-height:20px">保存后可在“我的”查看和修改。</div></div></div><div id="preferences.footer" style="position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 22px 16px 22px;width:100%;background-color:#FFFFFF;border-top-color:#E8DCD3;border-top-style:solid;border-top-width:1px"><div id="preferences.actions" style="position:relative;display:flex;flex-direction:row;gap:12px;width:100%"><button type="button" id="preferences.reset" data-stable-id="preferences.reset" style="height:48px;width:120px;background-color:#FFFFFF;border-radius:16px;color:#E6472F;font-size:15px;font-weight:600;line-height:22px">恢复默认</button><div id="preferences.save.wrapper" style="position:relative;display:flex;flex:1;flex-direction:column;gap:8px;width:100%"><button type="button" id="preferences.save" data-stable-id="preferences.save" style="height:48px;width:100%;background-color:#E6472F;border-radius:16px;color:#FFFFFF;font-size:15px;font-weight:600;line-height:22px">保存偏好</button></div></div></div></main></body>
</html>
