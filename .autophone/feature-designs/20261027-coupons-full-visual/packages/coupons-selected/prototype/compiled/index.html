<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>优惠券选择与金额明细 · selected</title>
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}button{appearance:none;background:transparent;border:0;font:inherit;margin:0;padding:0}.choice-header{align-items:center;display:flex;justify-content:space-between}.choice-option.is-selected::after{content:" ✓"}</style>
</head>
<body><main id="coupons.root" style="box-sizing:border-box;display:flex;flex-direction:column;height:932px;padding-bottom:37px;padding-top:59px;position:relative;width:430px;background-color:#FFF8EF;color:#241713"><div id="coupons.header" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:8px;height:64px;justify-content:space-between;padding:0px 22px 0px 22px;width:100%"><button type="button" id="coupons.back" data-stable-id="coupons.back" style="height:48px;width:64px;background-color:#FFFFFF;border-radius:16px;color:#E6472F;font-size:15px;font-weight:600;line-height:22px">返回</button><div id="coupons.brand" data-stable-id="coupons.brand" style="color:#E6472F;font-size:15px;font-weight:600;line-height:22px">Food AI</div></div><div id="coupons.content" style="position:relative;display:flex;flex:1;flex-direction:column;gap:16px;overflow:auto;padding:8px 22px 16px 22px;width:100%"><div id="coupons.title" data-stable-id="coupons.title" style="color:#241713;font-size:26px;font-weight:700;line-height:36px">优惠券选择与金额明细</div><div id="coupons.description" data-stable-id="coupons.description" style="color:#77655F;font-size:15px;font-weight:400;line-height:23px">按商品金额判断门槛，每单限用 1 张。</div><section id="coupons.option" style="gap:8px;width:100%"><div class="choice-header" style="margin-bottom:12px"><div style="color:#241713;font-size:18px;font-weight:600;line-height:26px">可用优惠券</div></div><div style="display:grid;gap:8px;grid-template-columns:repeat(1,minmax(0,1fr))"><button type="button" class="choice-option" id="coupons.option.none" data-stable-id="coupons.option.none" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px" aria-pressed="false">不使用优惠券</button><button type="button" class="choice-option is-selected" id="coupons.option.save6" data-stable-id="coupons.option.save6" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px;background-color:#F7D7B5;border-color:#E6472F;color:#E6472F" aria-pressed="true">满 ¥32 减 ¥6</button><button type="button" class="choice-option" id="coupons.option.save10" data-stable-id="coupons.option.save10" style="align-items:center;display:flex;justify-content:center;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:12px;border-style:solid;border-width:1px;color:#77655F;font-size:15px;font-weight:600;line-height:22px;min-height:52px" aria-pressed="false">满 ¥60 减 ¥10</button></div></section><div id="coupons.unavailable" style="position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 16px 16px 16px;width:100%;background-color:#FFFFFF;border-radius:16px"><div id="coupons.unavailable.save20.title" data-stable-id="coupons.unavailable.save20.title" style="color:#77655F;font-size:15px;font-weight:600;line-height:22px">满 ¥100 减 ¥20</div><div id="coupons.unavailable.save20.reason" data-stable-id="coupons.unavailable.save20.reason" style="color:#77655F;font-size:13px;font-weight:400;line-height:20px">还差 ¥36 可用</div></div><div id="coupons.bill" style="position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 16px 16px 16px;width:100%;background-color:#FFFFFF;border-radius:16px"><div id="coupons.bill.goods.row" style="position:relative;display:flex;flex-direction:row;gap:8px;justify-content:space-between;width:100%"><div id="coupons.bill.goods.label" data-stable-id="coupons.bill.goods.label" style="color:#241713;font-size:15px;font-weight:400;line-height:23px">商品金额</div><div id="coupons.bill.goods" data-stable-id="coupons.bill.goods" style="color:#241713;font-size:15px;font-weight:400;line-height:23px">¥64</div></div><div id="coupons.bill.fees.row" style="position:relative;display:flex;flex-direction:row;gap:8px;justify-content:space-between;width:100%"><div id="coupons.bill.fees.label" data-stable-id="coupons.bill.fees.label" style="color:#77655F;font-size:13px;font-weight:400;line-height:20px">包装费 ¥4 + 配送费 ¥3</div><div id="coupons.bill.fees" data-stable-id="coupons.bill.fees" style="color:#77655F;font-size:13px;font-weight:400;line-height:20px">¥7</div></div><div id="coupons.bill.discount.row" style="position:relative;display:flex;flex-direction:row;gap:8px;justify-content:space-between;width:100%"><div id="coupons.bill.discount.label" data-stable-id="coupons.bill.discount.label" style="color:#241713;font-size:15px;font-weight:600;line-height:22px">优惠</div><div id="coupons.bill.discount" data-stable-id="coupons.bill.discount" style="color:#E6472F;font-size:15px;font-weight:600;line-height:22px">−¥6</div></div></div></div><div id="coupons.footer" style="position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 22px 16px 22px;width:100%;background-color:#FFFFFF;border-top-color:#E8DCD3;border-top-style:solid;border-top-width:1px"><div id="coupons.payable.row" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:8px;justify-content:space-between;width:100%"><div id="coupons.payable.label" data-stable-id="coupons.payable.label" style="color:#241713;font-size:15px;font-weight:600;line-height:22px">应付金额</div><div id="coupons.payable" data-stable-id="coupons.payable" style="color:#E6472F;font-size:28px;font-weight:700;line-height:38px">¥65</div></div><button type="button" id="coupons.confirm" data-stable-id="coupons.confirm" style="height:48px;width:100%;background-color:#E6472F;border-radius:16px;color:#FFFFFF;font-size:15px;font-weight:600;line-height:22px">确认使用</button></div></main></body>
</html>
