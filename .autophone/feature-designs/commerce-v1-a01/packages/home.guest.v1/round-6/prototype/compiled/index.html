<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}button{appearance:none;background:transparent;border:0;font:inherit;margin:0;padding:0}.choice-header{align-items:center;display:flex;justify-content:space-between}.choice-option.is-selected::after{content:" ✓"}</style>

<body><main id="home.root" style="box-sizing:border-box;display:flex;flex-direction:column;height:932px;padding-bottom:37px;padding-top:59px;position:relative;width:430px;background-color:#FAF7F2;color:#251D19"><div id="home.header" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:10px;height:64px;justify-content:space-between;padding:8px 20px 12px 20px;width:100%"><div id="home.brand.group" style="position:relative;align-items:flex-end;display:flex;flex-direction:row;gap:4px;width:fit-content"><div id="home.brand" data-stable-id="home.brand" style="color:#C93C25;font-size:26px;font-weight:800;letter-spacing:-1px;line-height:37px">食刻</div><div id="home.brand.tagline" data-stable-id="home.brand.tagline" style="margin:0px 0px 7px 0px;color:#71655D;font-size:10px;font-weight:800;letter-spacing:2px;line-height:12px">FRESH MOMENTS</div></div><div id="home.header.messages" style="position:relative;align-items:center;display:flex;flex-direction:row;height:44px;justify-content:center;width:44px"><div id="home.header.messages.icon" style="height:22px;width:22px" aria-hidden="true"></div></div></div><div id="home.content" style="position:relative;display:flex;flex:1;flex-direction:column;overflow:hidden;padding:0px 20px 16px 20px;width:100%"><div id="home.scroll" style="position:relative;display:flex;flex-direction:column;width:100%"><div id="home.store.select" data-stable-id="home.store.select" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:12px;padding:1px 6px 1px 6px;width:fit-content"><div id="home.store.pin" style="height:17px;width:17px" aria-hidden="true"></div><div id="home.store.name" data-stable-id="home.store.name" style="color:#251D19;font-size:13px;font-weight:700;line-height:18px">科创园店</div><div id="home.store.distance" data-stable-id="home.store.distance" style="color:#71655D;font-size:12px;font-weight:400;line-height:19.8px">步行约5分钟</div><div id="home.store.chevron" style="height:17px;width:17px" aria-hidden="true"></div></div><div id="home.greeting" data-stable-id="home.greeting" style="margin:6px 0px 14px 0px;color:#71655D;font-size:13px;font-weight:400;line-height:18px">午餐时间，把好心情吃回来。</div><div id="home.hero" style="position:relative;align-items:flex-start;display:flex;flex-direction:column;height:214px;overflow:hidden;padding:22px 22px 22px 22px;width:100%;background-color:#F0D8B8;border-radius:24px"><div id="home.hero.eyebrow" data-stable-id="home.hero.eyebrow" style="color:#6E4B2A;font-size:10px;font-weight:600;letter-spacing:2px;line-height:17px">FRESHLY MADE · 现点现做</div><div id="home.hero.headline.line1" data-stable-id="home.hero.headline.line1" style="margin:10px 0px 0px 0px;color:#352418;font-size:29px;font-weight:800;line-height:37.7px">今天，</div><div id="home.hero.headline.line2" data-stable-id="home.hero.headline.line2" style="color:#352418;font-size:29px;font-weight:800;line-height:37.7px">来点热乎的。</div><div id="home.hero.offer" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:7px;margin:12px 0px 0px 0px;width:fit-content"><div id="home.hero.price" data-stable-id="home.hero.price" style="color:#8D311B;font-size:22px;font-weight:800;letter-spacing:-0.4px;line-height:26px">¥32.90</div><div id="home.hero.product" data-stable-id="home.hero.product" style="color:#6E4B2A;font-size:10px;font-weight:400;line-height:14px">香脆鸡腿堡套餐</div></div><div id="home.hero.tag.box" style="position:relative;display:flex;flex-direction:row;margin:12px 0px 0px 0px;padding:4px 8px 4px 8px;width:fit-content;background-color:#30271F;border-radius:6px"><div id="home.hero.tag" data-stable-id="home.hero.tag" style="color:#FFFFFF;font-size:10px;font-weight:400;line-height:14px">套餐推荐 · 演示活动</div></div><div id="home.hero.art" style="bottom:-13px;height:194px;position:absolute;right:-20px;width:228px" aria-hidden="true"></div></div><div id="home.modes" style="position:relative;display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin:14px 0px 0px 0px;width:100%"><div id="home.mode.pickup" data-stable-id="home.mode.pickup" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:10px;height:88px;padding:16px 12px 16px 12px;width:100%;background-color:#FFFFFF;border-color:#EEE4D9;border-radius:18px;border-style:solid;border-width:1px"><div id="home.mode.pickup.icon" style="height:42px;width:42px;background-color:#FFF0E7;border-radius:14px" aria-hidden="true"></div><div id="home.mode.pickup.copy" style="position:relative;display:flex;flex-direction:column;width:fit-content"><div id="home.mode.pickup.title" data-stable-id="home.mode.pickup.title" style="color:#251D19;font-size:17px;font-weight:700;line-height:24px">到店自取</div><div id="home.mode.pickup.subtitle" data-stable-id="home.mode.pickup.subtitle" style="color:#71655D;font-size:11px;font-weight:400;line-height:23px">提前点，到店拿</div></div></div><div id="home.mode.delivery" data-stable-id="home.mode.delivery" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:10px;height:88px;padding:16px 12px 16px 12px;width:100%;background-color:#FFFFFF;border-color:#EEE4D9;border-radius:18px;border-style:solid;border-width:1px"><div id="home.mode.delivery.icon" style="height:42px;width:42px;background-color:#FFF0E7;border-radius:14px" aria-hidden="true"></div><div id="home.mode.delivery.copy" style="position:relative;display:flex;flex-direction:column;width:fit-content"><div id="home.mode.delivery.title" data-stable-id="home.mode.delivery.title" style="color:#251D19;font-size:17px;font-weight:700;line-height:24px">外送到家</div><div id="home.mode.delivery.subtitle" data-stable-id="home.mode.delivery.subtitle" style="color:#71655D;font-size:11px;font-weight:400;line-height:23px">热乎美味送到家</div></div></div></div><div id="member.points.open" data-stable-id="member.points.open" style="position:relative;align-items:center;display:flex;flex-direction:row;justify-content:space-between;margin:14px 0px 0px 0px;padding:13px 15px 13px 15px;width:100%;background-color:#30271F;border-radius:14px"><div id="home.member.copy" style="position:relative;align-items:center;display:flex;flex-direction:row;height:19.14px;width:fit-content"><div id="home.member.title" data-stable-id="home.member.title" style="color:#F7EBD9;font-size:13px;font-weight:700;line-height:16px">食刻会员</div><div id="home.member.subtitle" data-stable-id="home.member.subtitle" style="color:#D8C5B3;font-size:11px;font-weight:400;line-height:13px">· 让每一餐都有回馈</div></div><div id="home.member.coupons" data-stable-id="home.member.coupons" style="color:#F7EBD9;font-size:13px;font-weight:400;line-height:18px">登录 ›</div></div><div id="home.shelf.header" style="position:relative;align-items:center;display:flex;flex-direction:row;height:44px;justify-content:space-between;margin:20px 0px 12px 0px;width:100%"><div id="home.shelf.title" data-stable-id="home.shelf.title" style="color:#251D19;font-size:18px;font-weight:700;line-height:25px">人气好滋味</div><button type="button" id="home.start_order" data-stable-id="home.start_order" style="height:44px;padding:8px 0px 8px 0px;width:fit-content;color:#71655D;font-size:13px;font-weight:400;line-height:18px">开始点餐 ›</button></div><div id="home.shelf" style="position:relative;display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));width:100%"><div id="menu.product.combo-chicken-001.open" data-stable-id="menu.product.combo-chicken-001.open" style="position:relative;display:flex;flex-direction:column;overflow:hidden;padding:1px 6px 1px 6px;width:100%;background-color:#FFFFFF;border-radius:18px"><div id="home.shelf.combo-chicken-001.art" style="height:104px;width:100%;background-color:#F5EADB" aria-hidden="true"></div><div id="home.shelf.combo-chicken-001.copy" style="position:relative;display:flex;flex-direction:column;gap:8px;padding:10px 12px 10px 12px;width:100%"><div id="home.shelf.combo-chicken-001.name" data-stable-id="home.shelf.combo-chicken-001.name" style="color:#251D19;font-size:13px;font-weight:700;line-height:18px">香脆鸡腿堡套餐</div><div id="home.shelf.combo-chicken-001.row" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:12px;justify-content:space-between;width:100%"><div id="home.shelf.combo-chicken-001.price" data-stable-id="home.shelf.combo-chicken-001.price" style="color:#C93C25;font-size:18px;font-weight:800;letter-spacing:-0.4px;line-height:21px">¥32.90</div><div id="home.shelf.combo-chicken-001.add" style="color:#251D19;font-size:14px;font-weight:400;line-height:20px">＋</div></div></div></div><div id="menu.product.combo-beef-002.open" data-stable-id="menu.product.combo-beef-002.open" style="position:relative;display:flex;flex-direction:column;overflow:hidden;padding:1px 6px 1px 6px;width:100%;background-color:#FFFFFF;border-radius:18px"><div id="home.shelf.combo-beef-002.art" style="height:104px;width:100%;background-color:#F5EADB" aria-hidden="true"></div><div id="home.shelf.combo-beef-002.copy" style="position:relative;display:flex;flex-direction:column;gap:8px;padding:10px 12px 10px 12px;width:100%"><div id="home.shelf.combo-beef-002.name" data-stable-id="home.shelf.combo-beef-002.name" style="color:#251D19;font-size:13px;font-weight:700;line-height:18px">炙烤牛肉堡套餐</div><div id="home.shelf.combo-beef-002.row" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:12px;justify-content:space-between;width:100%"><div id="home.shelf.combo-beef-002.price" data-stable-id="home.shelf.combo-beef-002.price" style="color:#C93C25;font-size:18px;font-weight:800;letter-spacing:-0.4px;line-height:21px">¥38.90</div><div id="home.shelf.combo-beef-002.add" style="color:#251D19;font-size:14px;font-weight:400;line-height:20px">＋</div></div></div></div></div><div id="home.ai.open" data-stable-id="home.ai.open" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:12px;height:59px;justify-content:space-between;margin:16px 0px 0px 0px;padding:16px 16px 16px 16px;width:100%;background-color:#FFF0E7;border-radius:20px"><div id="home.ai.copy" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:4px;width:fit-content"><div id="home.ai.icon" style="height:18px;width:18px" aria-hidden="true"></div><div id="home.ai.prompt" data-stable-id="home.ai.prompt" style="color:#251D19;font-size:14px;font-weight:400;line-height:27px">不知道吃什么？帮我搭一餐</div></div><div id="home.ai.chevron" style="color:#251D19;font-size:14px;font-weight:400;line-height:20px">›</div></div></div></div><div id="home.tabbar" style="position:relative;display:flex;flex-direction:row;height:59px;justify-content:space-between;padding:8px 16.89px 0px 16.89px;width:100%;background-color:#FFFFFF;border-top-color:#E7DED5;border-top-style:solid;border-top-width:1px"><button type="button" id="nav.home" data-stable-id="nav.home" style="height:50px;padding:24px 0px 0px 0px;width:65px;color:#C93C25;font-size:10px;font-weight:700;line-height:14px">首页</button><button type="button" id="nav.menu" data-stable-id="nav.menu" style="height:50px;padding:24px 0px 0px 0px;width:65px;color:#71655D;font-size:10px;font-weight:400;line-height:14px">点餐</button><button type="button" id="nav.coupons" data-stable-id="nav.coupons" style="height:50px;padding:24px 0px 0px 0px;width:65px;color:#71655D;font-size:10px;font-weight:400;line-height:14px">优惠</button><button type="button" id="nav.orders" data-stable-id="nav.orders" style="height:50px;padding:24px 0px 0px 0px;width:65px;color:#71655D;font-size:10px;font-weight:400;line-height:14px">订单</button><button type="button" id="nav.member" data-stable-id="nav.member" style="height:50px;padding:24px 0px 0px 0px;width:65px;color:#71655D;font-size:10px;font-weight:400;line-height:14px">我的</button></div></main></body>
