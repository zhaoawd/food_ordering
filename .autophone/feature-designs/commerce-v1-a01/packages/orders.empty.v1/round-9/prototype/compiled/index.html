<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>订单 · empty（commerce-v1 A01，430 重排；空态内容依据 D2）</title>
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}button{appearance:none;background:transparent;border:0;font:inherit;margin:0;padding:0}.choice-header{align-items:center;display:flex;justify-content:space-between}.choice-option.is-selected::after{content:" ✓"}</style>
</head>
<body><main id="orders.root" style="box-sizing:border-box;display:flex;flex-direction:column;height:932px;padding-bottom:37px;padding-top:59px;position:relative;width:430px;background-color:#FAF7F2;color:#251D19"><div id="orders.header" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:10px;height:64px;justify-content:space-between;padding:8px 20px 12px 20px;width:100%"><div id="orders.header.back" style="position:relative;align-items:center;display:flex;flex-direction:row;height:44px;justify-content:center;width:44px"><div id="orders.header.back.icon" style="height:22px;width:22px" aria-hidden="true"></div></div><div id="orders.title" data-stable-id="orders.title" style="color:#251D19;font-size:20px;font-weight:700;line-height:28px">我的订单</div><div id="orders.header.spacer" style="position:relative;display:flex;flex-direction:row;height:44px;width:44px"></div></div><div id="orders.content" style="position:relative;display:flex;flex:1;flex-direction:column;overflow:hidden;padding:0px 20px 16px 20px;width:100%"><div id="orders.scroll" style="position:relative;display:flex;flex-direction:column;width:100%"><div id="orders.filters" style="position:relative;display:flex;flex-direction:row;gap:4px;height:44px;margin:0px 0px 12px 0px;padding:4px 4px 4px 4px;width:100%;background-color:#EDE6DD;border-radius:11px"><button type="button" id="orders.filter.all" data-stable-id="orders.filter.all" style="height:36px;width:100%;background-color:#FFFFFF;border-radius:8px;color:#251D19;font-size:12px;font-weight:700;line-height:16px">全部</button><button type="button" id="orders.filter.active" data-stable-id="orders.filter.active" style="height:36px;width:100%;border-radius:8px;color:#251D19;font-size:12px;font-weight:400;line-height:16px">进行中</button><button type="button" id="orders.filter.completed" data-stable-id="orders.filter.completed" style="height:36px;width:100%;border-radius:8px;color:#251D19;font-size:12px;font-weight:400;line-height:16px">已完成</button><button type="button" id="orders.filter.after_sale" data-stable-id="orders.filter.after_sale" style="height:36px;width:100%;border-radius:8px;color:#251D19;font-size:12px;font-weight:400;line-height:16px">售后</button></div><div id="orders.empty" style="position:relative;align-items:center;display:flex;flex-direction:column;gap:16px;padding:24px 16px 24px 16px;width:100%;background-color:#FFFFFF;border-color:#F0E8DF;border-radius:20px;border-style:solid;border-width:1px"><div id="orders.empty.title" data-stable-id="orders.empty.title" style="color:#251D19;font-size:15px;font-weight:700;line-height:22px">还没有订单</div><button type="button" id="orders.empty.primary_action" data-stable-id="orders.empty.primary_action" style="height:46px;padding:0px 14px 0px 14px;width:fit-content;background-color:#FFFFFF;border-color:#E7DED5;border-radius:12px;border-style:solid;border-width:1px;color:#251D19;font-size:14px;font-weight:600;line-height:20px">去点餐</button></div></div></div><div id="orders.tabbar" style="position:relative;display:flex;flex-direction:row;height:59px;justify-content:space-between;padding:8px 16.89px 0px 16.89px;width:100%;background-color:#FFFFFF;border-top-color:#E7DED5;border-top-style:solid;border-top-width:1px"><button type="button" id="nav.home" data-stable-id="nav.home" style="height:50px;padding:24px 0px 0px 0px;width:65px;color:#71655D;font-size:10px;font-weight:400;line-height:14px">首页</button><button type="button" id="nav.menu" data-stable-id="nav.menu" style="height:50px;padding:24px 0px 0px 0px;width:65px;color:#71655D;font-size:10px;font-weight:400;line-height:14px">点餐</button><button type="button" id="nav.coupons" data-stable-id="nav.coupons" style="height:50px;padding:24px 0px 0px 0px;width:65px;color:#71655D;font-size:10px;font-weight:400;line-height:14px">优惠</button><button type="button" id="nav.orders" data-stable-id="nav.orders" style="height:50px;padding:24px 0px 0px 0px;width:65px;color:#C93C25;font-size:10px;font-weight:700;line-height:14px">订单</button><button type="button" id="nav.member" data-stable-id="nav.member" style="height:50px;padding:24px 0px 0px 0px;width:65px;color:#71655D;font-size:10px;font-weight:400;line-height:14px">我的</button></div></main></body>
</html>
