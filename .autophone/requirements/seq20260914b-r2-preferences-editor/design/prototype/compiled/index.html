<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Food AI 饮食偏好</title>
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}button{appearance:none;background:transparent;border:0;font:inherit;margin:0;padding:0}.choice-header{align-items:center;display:flex;justify-content:space-between}.choice-option.is-selected::after{content:" ✓"}</style>
</head>
<body><main id="preferences.root" style="box-sizing:border-box;display:flex;flex-direction:column;height:932px;padding-top:59px;position:relative;width:430px;background-color:#FFF8EF;color:#241713"><div id="preferences.header" style="position:relative;align-items:center;display:flex;flex-direction:row;height:52px;justify-content:center;width:100%;background-color:#FFF8EF;border-bottom-color:#E8DCD3;border-bottom-style:solid;border-bottom-width:1px"><button type="button" id="preferences.header.back" data-stable-id="preferences.header.back" style="align-items:center;display:flex;flex-direction:row;height:44px;left:20px;position:absolute;top:4px;width:fit-content;color:#E6472F;font-size:16px;font-weight:600;line-height:22px;font-weight:600;letter-spacing:0px">‹ 返回</button><div id="preferences.header.title" data-stable-id="preferences.header.title" style="color:#241713;font-size:18px;font-weight:700;line-height:24px;text-align:center;font-weight:700;letter-spacing:0px">饮食偏好</div></div><div id="preferences.content" style="position:relative;display:flex;flex:1;flex-direction:column;gap:25px;overflow:hidden;padding:22px 20px 20px 20px;width:100%"><section id="preferences.spice" style="gap:8px"><div class="choice-header" style="margin-bottom:11px"><div style="color:#241713;font-size:17px;font-weight:700;line-height:22px">辣度</div><div style="color:#77655F;font-size:12px;font-weight:400;line-height:22px">单选</div></div><div style="display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr))"><button type="button" class="choice-option" id="preferences.spice.none" data-stable-id="preferences.spice.none" style="align-items:center;display:flex;justify-content:center;background-color:#FFF8EF;border-color:#E8DCD3;border-radius:14px;border-style:solid;border-width:1px;color:#241713;font-size:14px;font-weight:400;line-height:20px;min-height:44px" aria-pressed="false">不辣</button><button type="button" class="choice-option is-selected" id="preferences.spice.mild" data-stable-id="preferences.spice.mild" style="align-items:center;display:flex;justify-content:center;background-color:#FFF8EF;border-color:#E8DCD3;border-radius:14px;border-style:solid;border-width:1px;color:#241713;font-size:14px;font-weight:400;line-height:20px;min-height:44px;background-color:#F7D7B5;border-color:#E6472F;border-style:solid;border-width:2px;color:#E6472F" aria-pressed="true">微辣</button><button type="button" class="choice-option" id="preferences.spice.medium" data-stable-id="preferences.spice.medium" style="align-items:center;display:flex;justify-content:center;background-color:#FFF8EF;border-color:#E8DCD3;border-radius:14px;border-style:solid;border-width:1px;color:#241713;font-size:14px;font-weight:400;line-height:20px;min-height:44px" aria-pressed="false">中辣</button><button type="button" class="choice-option" id="preferences.spice.hot" data-stable-id="preferences.spice.hot" style="align-items:center;display:flex;justify-content:center;background-color:#FFF8EF;border-color:#E8DCD3;border-radius:14px;border-style:solid;border-width:1px;color:#241713;font-size:14px;font-weight:400;line-height:20px;min-height:44px" aria-pressed="false">重辣</button></div></section><section id="preferences.budget" style="gap:10px"><div class="choice-header" style="margin-bottom:11px"><div style="color:#241713;font-size:17px;font-weight:700;line-height:22px">单餐预算</div><div style="color:#77655F;font-size:12px;font-weight:400;line-height:22px">单选</div></div><div style="display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))"><button type="button" class="choice-option" id="preferences.budget.under_20" data-stable-id="preferences.budget.under_20" style="align-items:center;display:flex;justify-content:center;background-color:#FFF8EF;border-color:#E8DCD3;border-radius:14px;border-style:solid;border-width:1px;color:#241713;font-size:14px;font-weight:400;line-height:20px;min-height:44px" aria-pressed="false">¥20 以下</button><button type="button" class="choice-option is-selected" id="preferences.budget.20_35" data-stable-id="preferences.budget.20_35" style="align-items:center;display:flex;justify-content:center;background-color:#FFF8EF;border-color:#E8DCD3;border-radius:14px;border-style:solid;border-width:1px;color:#241713;font-size:14px;font-weight:400;line-height:20px;min-height:44px;background-color:#F7D7B5;border-color:#E6472F;border-style:solid;border-width:2px;color:#E6472F" aria-pressed="true">¥20–35</button><button type="button" class="choice-option" id="preferences.budget.35_50" data-stable-id="preferences.budget.35_50" style="align-items:center;display:flex;justify-content:center;background-color:#FFF8EF;border-color:#E8DCD3;border-radius:14px;border-style:solid;border-width:1px;color:#241713;font-size:14px;font-weight:400;line-height:20px;min-height:44px" aria-pressed="false">¥35–50</button><button type="button" class="choice-option" id="preferences.budget.unlimited" data-stable-id="preferences.budget.unlimited" style="align-items:center;display:flex;justify-content:center;background-color:#FFF8EF;border-color:#E8DCD3;border-radius:14px;border-style:solid;border-width:1px;color:#241713;font-size:14px;font-weight:400;line-height:20px;min-height:44px" aria-pressed="false">不限</button></div></section><section id="preferences.avoid" style="gap:9px"><div class="choice-header" style="margin-bottom:11px"><div style="color:#241713;font-size:17px;font-weight:700;line-height:22px">忌口</div><div style="color:#77655F;font-size:12px;font-weight:400;line-height:22px">可多选</div></div><div style="display:grid;gap:9px;grid-template-columns:repeat(4,minmax(0,1fr))"><button type="button" class="choice-option" id="preferences.avoid.cilantro" data-stable-id="preferences.avoid.cilantro" style="align-items:center;display:flex;justify-content:center;background-color:#FFF8EF;border-color:#E8DCD3;border-radius:14px;border-style:solid;border-width:1px;color:#241713;font-size:14px;font-weight:400;line-height:20px;min-height:44px" aria-pressed="false">香菜</button><button type="button" class="choice-option" id="preferences.avoid.peanut" data-stable-id="preferences.avoid.peanut" style="align-items:center;display:flex;justify-content:center;background-color:#FFF8EF;border-color:#E8DCD3;border-radius:14px;border-style:solid;border-width:1px;color:#241713;font-size:14px;font-weight:400;line-height:20px;min-height:44px" aria-pressed="false">花生</button><button type="button" class="choice-option" id="preferences.avoid.dairy" data-stable-id="preferences.avoid.dairy" style="align-items:center;display:flex;justify-content:center;background-color:#FFF8EF;border-color:#E8DCD3;border-radius:14px;border-style:solid;border-width:1px;color:#241713;font-size:14px;font-weight:400;line-height:20px;min-height:44px" aria-pressed="false">乳制品</button><button type="button" class="choice-option" id="preferences.avoid.seafood" data-stable-id="preferences.avoid.seafood" style="align-items:center;display:flex;justify-content:center;background-color:#FFF8EF;border-color:#E8DCD3;border-radius:14px;border-style:solid;border-width:1px;color:#241713;font-size:14px;font-weight:400;line-height:20px;min-height:44px" aria-pressed="false">海鲜</button></div></section><div id="preferences.summary.card" style="position:relative;display:flex;flex-direction:column;gap:7px;height:64px;padding:10px 14px 10px 14px;width:100%;background-color:#F7D7B5;border-radius:16px"><div id="preferences.summary.label" data-stable-id="preferences.summary.label" style="color:#77655F;font-size:12px;font-weight:700;line-height:15px;font-weight:700;letter-spacing:0px">当前偏好</div><div id="preferences.summary" data-stable-id="preferences.summary" style="color:#241713;font-size:15px;font-weight:600;line-height:20px;font-weight:600;letter-spacing:0px">微辣 · ¥20–35 · 无忌口</div><div id="preferences.summary.decor" style="bottom:10px;height:6px;position:absolute;right:12px;width:32px;background-color:#E6472F;border-radius:3px" aria-hidden="true"></div></div></div><div id="preferences.actions" style="position:relative;display:flex;flex-direction:row;gap:12px;height:96px;padding:12px 20px 34px 20px;width:100%;background-color:#FFF8EF;border-top-color:#E8DCD3;border-top-style:solid;border-top-width:1px"><button type="button" id="preferences.actions.reset" data-stable-id="preferences.actions.reset" style="height:50px;width:132px;background-color:#FFF8EF;border-color:#E8DCD3;border-radius:16px;border-style:solid;border-width:1px;color:#77655F;font-size:16px;font-weight:700;line-height:20px;font-weight:700;letter-spacing:0px">恢复默认</button><button type="button" id="preferences.actions.save" data-stable-id="preferences.actions.save" style="flex:1;height:50px;width:100%;background-color:#E6472F;border-radius:16px;color:#FFFFFF;font-size:16px;font-weight:700;line-height:20px;font-weight:700;letter-spacing:0px">保存偏好</button></div></main></body>
</html>
