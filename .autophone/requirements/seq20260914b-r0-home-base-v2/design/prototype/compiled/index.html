<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Food AI 基础首页</title>
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}button{appearance:none;background:transparent;border:0;font:inherit;margin:0;padding:0}.choice-header{align-items:center;display:flex;justify-content:space-between}.choice-option.is-selected::after{content:" ✓"}</style>
</head>
<body><main id="home.root" data-stable-id="home.root" style="box-sizing:border-box;display:flex;flex-direction:column;height:932px;padding-top:59px;position:relative;width:430px;background-color:#FFF8EF;color:#241713"><div id="home.header" style="position:relative;align-items:center;display:flex;flex-direction:row;height:44px;justify-content:space-between;padding:0px 18px 0px 18px;width:100%"><div id="home.header.location" data-stable-id="home.header.location" style="height:21px;width:120px;color:#241713;font-size:15px;font-weight:600;line-height:21px;font-weight:500;letter-spacing:0.3px">送至 · 望京</div><div id="home.header.cart" data-stable-id="home.header.cart" style="position:relative;align-items:center;display:flex;flex-direction:row;height:38px;justify-content:center;width:38px;background-color:#FFFFFF;border-radius:80px"><div id="home.header.cart.icon" style="color:#241713;font-size:14px;font-weight:700;line-height:18px">袋</div><div id="home.header.cart_badge" style="height:20px;position:absolute;right:0px;top:0px;width:20px;background-color:#E6472F;border-radius:80px;color:#FFFFFF;font-size:12px;font-weight:800;line-height:20px;text-align:center">2</div></div></div><div id="home.intro" style="position:relative;display:flex;flex-direction:column;height:151px;padding:0px 21px 14px 21px;width:100%"><div id="home.brand.wordmark" data-stable-id="home.brand.wordmark" style="height:34px;width:120px;color:#E6472F;font-size:26px;font-weight:800;line-height:34px;font-weight:800;letter-spacing:0px">Food AI</div><div id="home.hero.headline" data-stable-id="home.hero.headline" style="height:46px;margin:3px 0px 0px 0px;width:360px;color:#241713;font-size:32px;font-weight:800;line-height:46px;-webkit-text-stroke-width:0.4px;font-weight:900;letter-spacing:-1.5px">今晚，好好吃一顿</div><div id="home.ai_prompt" style="position:relative;align-items:center;display:flex;flex-direction:row;height:44px;margin:8px 0px 0px 0px;padding:0px 4px 0px 16px;width:100%;background-color:#FFFFFF;border-color:#E8DCD3;border-radius:16px;border-style:solid;border-width:1px"><div id="home.ai_prompt.input" data-stable-id="home.ai_prompt.input" style="height:20px;width:332px;color:#77655F;font-size:14px;font-weight:500;line-height:20px;font-weight:470;letter-spacing:-0.1px">想吃热乎的、微辣、别太油</div><button type="button" id="home.ai_prompt.submit" data-stable-id="home.ai_prompt.submit" style="height:36px;width:36px;background-color:#E6472F;border-radius:80px;color:#FFFFFF;font-size:20px;font-weight:700;line-height:24px;font-weight:700;letter-spacing:0px">→</button></div></div><div id="home.recommendation.card" style="position:relative;display:flex;flex-direction:column;height:608px;overflow:hidden;width:100%;background-color:#FFFFFF"><div id="home.recommendation.image" style="position:relative;align-items:center;display:flex;flex-direction:row;height:350px;justify-content:center;overflow:hidden;width:100%;background-color:#7E3825"><div id="home.recommendation.image.halo" style="height:270px;width:270px;background-color:#B7653E;border-radius:80px" aria-hidden="true"></div><div id="home.recommendation.image.bowl" style="height:170px;left:100px;position:absolute;top:85px;width:230px;background-color:#EAB478;border-radius:80px" aria-hidden="true"></div></div><div id="home.recommendation.details" style="position:relative;display:flex;flex:1;flex-direction:column;gap:6px;padding:10px 22px 8px 22px;width:100%"><div id="home.recommendation.match_score" data-stable-id="home.recommendation.match_score" style="height:20px;width:100px;background-color:#F7D7B5;border-radius:14px;color:#241713;font-size:13px;font-weight:700;line-height:20px;text-align:center;font-weight:700;letter-spacing:0px">匹配度 96%</div><div id="home.recommendation.title" data-stable-id="home.recommendation.title" style="height:31px;width:386px;color:#241713;font-size:24px;font-weight:800;line-height:31px;-webkit-text-stroke-width:0.1px;font-weight:900;letter-spacing:-1.4px">炙烤牛肉拌饭</div><div id="home.recommendation.attributes" data-stable-id="home.recommendation.attributes" style="height:20px;width:386px;color:#77655F;font-size:14px;font-weight:400;line-height:20px;font-weight:400;letter-spacing:0px">热乎、微辣，预计 30 分钟送达</div><div id="home.recommendation.pagination" data-stable-id="home.recommendation.pagination" style="height:14px;width:50px;color:#E6472F;font-size:11px;font-weight:700;line-height:14px;font-weight:700;letter-spacing:0px">1 / 4</div><div id="home.recommendation.purchase_meta" style="position:relative;align-items:center;display:flex;flex-direction:row;gap:18px;height:32px;width:100%"><div id="home.recommendation.price" data-stable-id="home.recommendation.price" style="height:29px;width:60px;color:#E6472F;font-size:23px;font-weight:800;line-height:29px;font-weight:800;letter-spacing:0px">¥32</div><div id="home.recommendation.eta" data-stable-id="home.recommendation.eta" style="height:18px;width:180px;color:#77655F;font-size:13px;font-weight:600;line-height:18px;font-weight:500;letter-spacing:0.1px">25–35 分钟 · 预计送达</div></div><button type="button" id="home.recommendation.primary_action" data-stable-id="home.recommendation.primary_action" style="height:46px;width:100%;background-color:#E6472F;border-radius:16px;color:#FFFFFF;font-size:16px;font-weight:700;line-height:22px;font-weight:700;letter-spacing:0px">就吃这个</button><button type="button" id="home.recommendation.next_action" data-stable-id="home.recommendation.next_action" style="height:28px;width:100%;background-color:#FFFFFF;color:#E6472F;font-size:16px;font-weight:700;line-height:22px;font-weight:700;letter-spacing:0px">换一道</button></div></div><div id="home.navigation" style="position:relative;display:flex;flex-direction:row;height:70px;padding:5px 9px 14px 9px;width:100%;background-color:#FFFFFF;border-top-color:#E8DCD3;border-top-style:solid;border-top-width:1px"><button type="button" id="home.navigation.home" data-stable-id="home.navigation.home" style="height:50px;width:103px;background-color:#F7D7B5;border-radius:16px;color:#E6472F;font-size:12px;font-weight:600;line-height:17px;font-weight:500;letter-spacing:-0.5px">首页</button><button type="button" id="home.navigation.discover" data-stable-id="home.navigation.discover" style="height:50px;width:103px;background-color:#FFFFFF;color:#77655F;font-size:12px;font-weight:600;line-height:17px;font-weight:500;letter-spacing:-0.5px">发现</button><button type="button" id="home.navigation.orders" data-stable-id="home.navigation.orders" style="height:50px;width:103px;background-color:#FFFFFF;color:#77655F;font-size:12px;font-weight:600;line-height:17px;font-weight:500;letter-spacing:-0.5px">订单</button><button type="button" id="home.navigation.profile" data-stable-id="home.navigation.profile" style="height:50px;width:103px;background-color:#FFFFFF;color:#77655F;font-size:12px;font-weight:600;line-height:17px;font-weight:500;letter-spacing:-0.5px">我的</button></div></main></body>
</html>
